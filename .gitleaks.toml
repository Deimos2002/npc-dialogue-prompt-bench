title = "NPC benchmark secret scanning"

[extend]
useDefault = true

# These exact evidence fields are deterministic recording hashes, not credentials.
# Match only the finding, not the whole JSON line: a real secret elsewhere on
# the same line must still be detected. Both the path AND field shape must match.
# Configuration: https://github.com/gitleaks/gitleaks/blob/v8.30.1/README.md
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Recording identity hashes in the frozen October development evidence"
condition = "AND"
regexTarget = "match"
regexes = ['''^(?:recording_)?key"\s*:\s*"[a-f0-9]{64}"$''']
paths = ['''(?:^|/)results/mount-hua-2026-10-09/(?:allocation-transcriptions\.json|(?:groq|gemini)-v4-full-01/(?:recordings\.jsonl|checks\.jsonl|review/review-map\.json))$''']

# Keep the default provider/token detectors and cover these explicit assignments,
# including key formats that do not have a distinctive provider prefix.
[[rules]]
id = "mistral-api-key-assignment"
description = "Mistral API key assignment"
regex = '''(?i)mistral_api_key\s*[=:]\s*["']?([A-Za-z0-9_-]{20,})'''
secretGroup = 1
entropy = 3.0
keywords = ["mistral_api_key"]

[[rules]]
id = "langfuse-secret-key-assignment"
description = "Langfuse secret key assignment"
regex = '''(?i)langfuse_secret_key\s*[=:]\s*["']?([A-Za-z0-9_-]{20,})'''
secretGroup = 1
entropy = 3.0
keywords = ["langfuse_secret_key"]
